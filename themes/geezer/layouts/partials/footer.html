<footer class="site-footer">
  <div class="container">
    <img src="{{ .Site.Params.logoURL }}" alt="{{ .Site.Params.brandName }} Logo" class="footer-logo-img">
    <p class="footer-label">{{ .Site.Params.brandName }}</p>
    <p class="footer-tagline">{{ .Site.Params.tagline }}</p>
    
    <div class="footer-social">
      {{ with .Site.Params.social.spotify }}
      <a href="{{ . }}" class="footer-social-link" target="_blank" aria-label="Spotify">
        <svg class="footer-social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      </a>
      {{ end }}
      {{ with .Site.Params.social.bluesky }}
      <a href="{{ . }}" class="footer-social-link" target="_blank" aria-label="Bluesky">
        <svg class="footer-social-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 501"><path d="M123.121 33.664C188.241 82.553 258.281 181.68 284 234.873c25.719-53.192 95.759-152.32 160.879-201.21C491.866-1.611 568-28.906 568 57.947c0 17.346-9.945 145.713-15.778 166.555-20.275 72.453-94.155 90.933-159.875 79.748C507.222 323.8 536.444 388.56 473.922 453.32c-119.86 122.992-172.252-30.859-185.702-70.281-2.667-7.818-3.916-11.479-3.92-8.379-.004-3.1-1.253.561-3.92 8.379-13.45 39.422-65.842 193.273-185.702 70.281-62.522-64.76-33.3-129.52 81.675-149.07-65.72 11.185-139.6-7.295-159.875-79.748C10.945 203.66 1 75.293 1 57.947 1-28.906 77.134-1.611 123.121 33.664Z"/></svg>
      </a>
      {{ end }}
    </div>

    <nav class="footer-nav">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <p class="footer-copyright">&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
  </div>
</footer>
