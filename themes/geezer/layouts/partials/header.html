<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">
      <img src="{{ .Site.Params.logoURL }}" alt="{{ .Site.Params.brandName }} Logo" class="header-logo-img">
      <div class="site-title-group">
        <span class="site-name">{{ .Site.Params.brandName }}</span>
        <span class="site-label">by {{ .Site.Params.author }}</span>
      </div>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul class="nav-list">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL | relURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
